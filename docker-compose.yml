services:
  db:
    image: postgis/postgis:15-3.3
    container_name: bluechain_postgis
    environment:
      POSTGRES_USER: bluechain
      POSTGRES_PASSWORD: bluechain_password
      POSTGRES_DB: bluechain_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluechain -d bluechain_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bluechain_backend
    environment:
      - DATABASE_URL=postgresql://bluechain:bluechain_password@db:5432/bluechain_db
      - USE_SAMPLE_DATA=true
      - SAMPLE_DATA_DIR=data/sample
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./ml/models:/app/ml/models
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: bluechain_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgis_data:
